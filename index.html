<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aurum Finanças</title>
  <meta name="theme-color" content="#050b1a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f3d27a'/%3E%3Cstop offset='1' stop-color='%23b8862b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230a1630'/%3E%3Cpath d='M18 46 32 16l14 30M23 36h18' stroke='url(%23g)' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Camadas de fundo -->
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>
  <div class="grid-floor" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="noise" aria-hidden="true"></div>
  <div class="cursor-glow" aria-hidden="true"></div>

  <!-- Splash -->
  <div id="splash">
    <div class="splash-inner">
      <svg class="splash-logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f3d27a"/><stop offset="1" stop-color="#b8862b"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="29" fill="none" stroke="url(#sg)" stroke-width="1.5" class="splash-ring"/>
        <path d="M18 46 32 16l14 30M23 36h18" stroke="url(#sg)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="splash-a"/>
      </svg>
      <div class="splash-title">AURUM</div>
      <div class="splash-sub">finanças pessoais</div>
      <div class="splash-bar"><span></span></div>
    </div>
  </div>

  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 46 32 16l14 30M23 36h18" stroke="url(#sg)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="brand-name">AURUM</div>
          <div class="brand-tag">controle financeiro</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-view="painel"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg><span>Painel</span></button>
        <button class="nav-item" data-view="pix"><svg viewBox="0 0 24 24"><path d="m12 2 4.5 4.5-2.1 2.1L12 6.2 9.6 8.6 7.5 6.5zM2 12l4.5-4.5 2.1 2.1L6.2 12l2.4 2.4-2.1 2.1zm10 10-4.5-4.5 2.1-2.1 2.4 2.4 2.4-2.4 2.1 2.1zm10-10-4.5 4.5-2.1-2.1 2.4-2.4-2.4-2.4 2.1-2.1zM12 9.2 14.8 12 12 14.8 9.2 12z"/></svg><span>Pagamentos</span><em class="nav-badge" id="badge-pix"></em></button>
        <button class="nav-item" data-view="cartoes"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm-1 4h20v3H2zm3 6h5v1.5H5z"/></svg><span>Cartões</span><em class="nav-badge" id="badge-cartoes"></em></button>
        <button class="nav-item" data-view="receitas"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm1 5h-2v1.1A3 3 0 0 0 8.5 11c0 1.7 1.4 2.4 3 2.8 1.2.3 1.5.6 1.5 1.1s-.5 1-1.5 1c-1.1 0-1.6-.5-1.7-1.2H8.2c.1 1.6 1.2 2.7 2.8 3v1.2h2v-1.2c1.5-.3 2.6-1.3 2.6-2.9 0-1.8-1.4-2.5-3.1-2.9-1.2-.3-1.4-.6-1.4-1s.4-.9 1.3-.9c.9 0 1.3.4 1.4 1h1.6c-.1-1.4-1-2.4-2.4-2.8z"/></svg><span>Recebimentos</span><em class="nav-badge" id="badge-receitas"></em></button>
        <button class="nav-item" data-view="reserva"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 4h16a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-1v1.5h-3V19H8v1.5H5V19H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm8 3.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg><span>Reserva</span></button>
        <button class="nav-item" data-view="ajustes"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3.5h-4L10.6 6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg><span>Ajustes</span></button>
      </nav>

      <div class="sidebar-foot">
        <div class="storage-pill" id="storage-pill"><i></i><span>conectando…</span></div>
        <div class="clock" id="clock"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <div class="eyebrow" id="greeting">Olá</div>
          <h1 id="view-title">Painel</h1>
        </div>
        <div class="month-switch" id="month-switch">
          <button class="icon-btn" data-month="-1" aria-label="Mês anterior"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
          <button class="month-label" id="month-label" title="Voltar para o mês atual"></button>
          <button class="icon-btn" data-month="1" aria-label="Próximo mês"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
        <button class="btn btn-gold quick-add" id="quick-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Novo</span></button>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <div id="modal-root"></div>
  <div id="toasts"></div>
  <div id="tooltip" role="tooltip"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="app.js"></script>
</body>
</html>
